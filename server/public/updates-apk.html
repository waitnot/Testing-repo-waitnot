<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaitNot Captain — Update</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .version { font-size: 13px; color: #888; margin-bottom: 16px; }
    .notes {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #555;
      margin-bottom: 24px;
      text-align: left;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      background: #EF4444;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn:active { background: #dc2626; }
    .btn-secondary {
      background: none;
      border: 1px solid #ddd;
      color: #666;
      font-size: 15px;
      font-weight: 500;
      padding: 12px;
    }
    .status { font-size: 13px; color: #888; margin-top: 14px; min-height: 20px; }
    .steps {
      text-align: left;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.7;
    }
    .steps strong { display: block; margin-bottom: 4px; color: #78350f; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1>Update Available</h1>
    <p class="version" id="version-label">Loading...</p>

    <div class="notes" id="release-notes"></div>

    <div class="steps">
      <strong>📲 How to install:</strong>
      1. Tap "Download APK" below<br>
      2. Open the downloaded file<br>
      3. Tap "Install" when prompted<br>
      4. Allow "Install unknown apps" if asked
    </div>

    <a class="btn" id="download-btn" href="#" download="WaitNot-Captain.apk">
      ⬇ Download APK
    </a>
    <button class="btn btn-secondary" onclick="window.history.back()">
      Remind Me Later
    </button>
    <p class="status" id="status"></p>
  </div>

  <script>
    const API = window.location.origin;

    // Fetch version info and set download link
    fetch(API + '/api/app-version')
      .then(r => r.json())
      .then(data => {
        document.getElementById('version-label').textContent = 'Version ' + (data.version || '');
        const notes = document.getElementById('release-notes');
        if (data.releaseNotes) {
          notes.textContent = data.releaseNotes;
          notes.style.display = 'block';
        } else {
          notes.style.display = 'none';
        }
        const btn = document.getElementById('download-btn');
        // Use direct APK URL from server if available, else /downloads/waitnot-captain.apk
        const apkUrl = (data.downloadUrl && data.downloadUrl.endsWith('.apk'))
          ? data.downloadUrl
          : API + '/downloads/waitnot-captain.apk';
        btn.href = apkUrl;
        btn.onclick = function() {
          document.getElementById('status').textContent = 'Download started — check your notification bar';
        };
      })
      .catch(() => {
        document.getElementById('version-label').textContent = 'New version available';
        document.getElementById('download-btn').href = API + '/downloads/waitnot-captain.apk';
      });
  </script>
</body>
</html>

name: Build Captain APK

on:
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'client/android/**'
      - 'client/vite.captain.config.js'
      - 'client/index-captain.html'
      - 'client/package.json'
      - '.github/workflows/build-captain-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: client

      - name: Build captain web app
        run: npm run build:captain
        working-directory: client

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Swap to captain capacitor config
        run: cp capacitor.captain.json capacitor.config.json
        working-directory: client

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: client

      - name: Patch capacitor.plugins.json with custom plugins
        run: |
          cat > android/app/src/main/assets/capacitor.plugins.json << 'EOF'
          [
            {"pkg": "@ascentio-it/capacitor-bluetooth-serial", "classpath": "com.bluetoothserial.plugin.BluetoothSerialPlugin"},
            {"pkg": "com.waitnot.captain", "classpath": "com.waitnot.captain.FcmPlugin"},
            {"pkg": "com.waitnot.captain", "classpath": "com.waitnot.captain.NotificationPlugin"},
            {"pkg": "com.waitnot.captain", "classpath": "com.waitnot.captain.SecureStoragePlugin"}
          ]
          EOF
        working-directory: client

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        working-directory: client/android

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: client/android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaitNot-Captain-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
